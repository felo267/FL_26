<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fantasy League — مؤتمر إعدادي بنين 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1730;
  --navy-2:#101F40;
  --navy-3:#152A52;
  --navy-line:#233b66;
  --gold:#E9BE4D;
  --gold-2:#F4D778;
  --blue:#4C8DE0;
  --green:#33C481;
  --red:#EF5A5A;
  --ink:#EAF0FB;
  --ink-dim:#9FB1D6;
  --card:#0F1E3C;
  --radius:18px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, #1c3a6e55, transparent 60%),
    radial-gradient(900px 500px at -10% 10%, #E9BE4D22, transparent 55%),
    var(--navy);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  padding-bottom:70px;
}
h1,h2,h3,.disp{font-family:'Cairo',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:'Tajawal',sans-serif;cursor:pointer}
::selection{background:var(--gold);color:var(--navy)}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, rgba(10,23,48,.97), rgba(10,23,48,.88));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--navy-line);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.crest{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,var(--gold),#a9781f);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cairo';font-weight:900;color:var(--navy);font-size:15px;
  box-shadow:0 4px 14px -4px #E9BE4D88;
}
.brand-text{line-height:1.15}
.brand-text b{font-family:'Cairo';font-weight:800;font-size:14.5px;display:block}
.brand-text span{font-size:11px;color:var(--ink-dim)}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{
  white-space:nowrap;font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:999px;
  color:var(--ink-dim);border:1px solid transparent;transition:.15s;
}
.nav a.active{background:var(--gold);color:#20180a;box-shadow:0 4px 14px -5px #E9BE4D77}
.nav a:not(.active):hover{background:var(--navy-3);color:var(--ink)}

/* ---------- Layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
.hero{
  border-radius:22px;padding:30px 26px;margin-bottom:22px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#10254c,#0c1a38 60%);
  border:1px solid var(--navy-line);
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(420px 220px at 90% 0%, #E9BE4D2c, transparent 70%);
}
.hero h1{font-size:clamp(22px,4vw,32px);font-weight:900;margin:0 0 6px;position:relative;z-index:1;
  background:linear-gradient(90deg,#fff,var(--gold-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:0;color:var(--ink-dim);font-size:14px;position:relative;z-index:1}
.hero .tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--gold-2);
  background:#E9BE4D18;border:1px solid #E9BE4D3a;padding:5px 11px;border-radius:999px;margin-bottom:12px;
  position:relative;z-index:1;
}

.grid{display:grid;gap:14px}
.g-stats{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g-stats{grid-template-columns:repeat(2,1fr)}.g-2{grid-template-columns:1fr}.g-3{grid-template-columns:1fr}}

.card{
  background:linear-gradient(160deg,var(--card),#0b1730);
  border:1px solid var(--navy-line); border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow);
}
.stat-card{padding:16px}
.stat-card .n{font-family:'Cairo';font-weight:900;font-size:28px;color:var(--gold-2)}
.stat-card .l{font-size:12.5px;color:var(--ink-dim);margin-top:2px}

.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title h2{font-size:17px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.section-title .sub{font-size:12px;color:var(--ink-dim);font-weight:500}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--navy-3);color:var(--ink-dim)}

/* podium */
.podium{display:flex;gap:10px;align-items:flex-end;margin:6px 0 18px}
.podium .slot{flex:1;border-radius:16px;padding:14px 10px;text-align:center;position:relative;border:1px solid var(--navy-line)}
.podium .slot.p1{background:linear-gradient(160deg,#3a2f0f,#1c1708);border-color:#E9BE4D55;order:2;padding-top:22px}
.podium .slot.p2{background:linear-gradient(160deg,#1b2740,#101c33);order:1}
.podium .slot.p3{background:linear-gradient(160deg,#241a30,#151020);order:3}
.podium .medal{font-family:'Cairo';font-weight:900;font-size:22px}
.podium .p1 .medal{color:var(--gold-2);font-size:26px}
.podium .p2 .medal{color:#c7d6f2}
.podium .p3 .medal{color:#d99a6c}
.podium .name{font-weight:800;font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .pts{color:var(--ink-dim);font-size:12px;margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;color:var(--ink-dim);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--navy-line)}
td{padding:9px 10px;border-bottom:1px solid #182c52}
tr:last-child td{border-bottom:none}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;font-weight:800;font-size:12px;background:var(--navy-3)}
.rank-1{background:linear-gradient(145deg,var(--gold),#a9781f);color:#20180a}
.rank-2{background:#324364;color:#e8eefc}
.rank-3{background:#3a2a48;color:#f0d9ff}
.chg-up{color:var(--green);font-weight:800}
.chg-down{color:var(--red);font-weight:800}
.chg-same{color:var(--ink-dim)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;padding:10px 16px;border-radius:12px;border:1px solid var(--navy-line);background:var(--navy-3);color:var(--ink);transition:.15s}
.btn:hover{border-color:#3a5b96}
.btn-gold{background:linear-gradient(145deg,var(--gold),#c99a2e);color:#20180a;border:none;box-shadow:0 6px 18px -8px #E9BE4D88}
.btn-gold:hover{filter:brightness(1.06)}
.btn-blue{background:linear-gradient(145deg,#5a9df0,var(--blue));color:#0c1a33;border:none}
.btn-red{background:transparent;border:1px solid #EF5A5A55;color:var(--red)}
.btn-red:hover{background:#EF5A5A15}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-block{width:100%;justify-content:center}

/* inputs */
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{
  width:100%;background:var(--navy-2);border:1px solid var(--navy-line);color:var(--ink);
  padding:10px 12px;border-radius:10px;font-size:14px;font-family:'Tajawal';outline:none;transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #E9BE4D22}
label{font-size:12.5px;color:var(--ink-dim);font-weight:700;display:block;margin-bottom:5px}
.field{margin-bottom:12px}

/* player cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.pcard{
  background:linear-gradient(165deg,var(--card),#0c1a38);border:1px solid var(--navy-line);border-radius:16px;
  padding:12px;text-align:center;position:relative;cursor:pointer;transition:.15s;
}
.pcard:hover{border-color:#3a5b96;transform:translateY(-2px)}
.pcard.selected{border-color:var(--gold);box-shadow:0 0 0 2px #E9BE4D55}
.pcard.empty{opacity:.35;cursor:default}
.pcard .num{position:absolute;top:8px;right:10px;font-family:'Cairo';font-weight:900;font-size:11px;color:var(--ink-dim)}
.avatar{
  width:62px;height:62px;border-radius:50%;margin:6px auto 10px;display:flex;align-items:center;justify-content:center;
  font-family:'Cairo';font-weight:900;font-size:22px;color:#0c1a33;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.pcard .pname{font-weight:800;font-size:13px;line-height:1.3;min-height:34px;display:flex;align-items:center;justify-content:center}
.pcard .prow{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px}
.pcard .prow b{color:var(--gold-2);font-family:'Cairo'}
.check{
  position:absolute;top:8px;left:10px;width:20px;height:20px;border-radius:6px;border:2px solid var(--navy-line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;
}
.pcard.selected .check{background:var(--gold);border-color:var(--gold);color:#20180a}

.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#132548;border:1px solid var(--navy-line);color:var(--ink);padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);animation:pop .18s ease-out}
.toast.ok{border-color:#33C48166;color:#a6f0cf}
.toast.err{border-color:#EF5A5A66;color:#ffc7c7}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.empty-state{text-align:center;padding:40px 10px;color:var(--ink-dim)}
.empty-state .big{font-size:34px;margin-bottom:8px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--navy-line);border-top-color:var(--gold);animation:spin .8s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center-loading{text-align:center;color:var(--ink-dim);font-size:13px}

.searchbar{position:relative;margin-bottom:14px}
.searchbar input{padding-right:38px}
.searchbar .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-dim)}

.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--navy-line);padding-bottom:0}
.tabs button{background:none;border:none;color:var(--ink-dim);font-weight:800;font-size:13.5px;padding:10px 14px;border-bottom:2px solid transparent}
.tabs button.active{color:var(--gold-2);border-bottom-color:var(--gold)}

.sticky-bar{
  position:sticky;bottom:0;background:linear-gradient(0deg,var(--navy) 55%,transparent);
  padding:16px 0 4px;margin-top:8px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
}
.badge-status{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.badge-ready{background:#33C48122;color:#7fe6b8}
.badge-empty{background:#ffffff14;color:var(--ink-dim)}

.admin-lock{max-width:380px;margin:60px auto;text-align:center}
.admin-lock .icon{font-size:38px;margin-bottom:10px}

.mini-table-wrap{overflow-x:auto}
.notice{background:#4C8DE015;border:1px solid #4C8DE040;color:#bcd7f7;font-size:12.5px;padding:10px 14px;border-radius:12px;margin-bottom:14px}
.notice.warn{background:#EF5A5A12;border-color:#EF5A5A3a;color:#ffcccc}
.kicker{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--gold-2);text-transform:uppercase;margin-bottom:4px;display:block}
.divider{height:1px;background:var(--navy-line);margin:18px 0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
.chiplist{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;background:var(--navy-3);border:1px solid var(--navy-line);padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:5px}
.chip button{background:none;border:none;color:var(--red);font-weight:900;padding:0;font-size:13px}
.footer-note{text-align:center;color:var(--ink-dim);font-size:11.5px;margin-top:30px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="crest">FL</div>
      <div class="brand-text"><b>Fantasy League</b><span>مؤتمر إعدادي بنين 2026</span></div>
    </div>
    <div class="nav" id="nav">
      <a href="#/dashboard" data-r="dashboard">الرئيسية</a>
      <a href="#/players" data-r="players">اللاعبون</a>
      <a href="#/team" data-r="team">فريقي</a>
      <a href="#/leaderboard" data-r="leaderboard">الترتيب</a>
      <a href="#/scoring" data-r="scoring">تسجيل النقاط</a>
      <a href="#/admin" data-r="admin">الإدارة</a>
    </div>
  </div>
</div>
<div class="wrap" id="app"><div class="spinner"></div><div class="center-loading">جاري تحميل البيانات…</div></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* ============================================================
   STATE & CONSTANTS
============================================================ */
const SEED_NAMES = ["افرام هادى", "انطوان اكرامي", "ايفان جون سلامة", "باتريك هاني فاروق", "بافلي ايمن خليل", "بولا ايمن كمال", "بولا عماد فؤاد", "بولا هاني سمير", "بيشوي اشرف ناصر", "توني بيشوي جمال", "جيوفاني ايميل ابراهيم", "جون ماجد ناجي", "جوناثان جون جيد", "دانيال ايهاب", "رؤوف رامي", "ستيفن دميان", "ستيفن مايكل", "شوقي سامي", "صموئيل سعد", "فيلوباتير ميلاد", "كاراس القس كيرلس", "كاراس نبيل وجية", "كارلوس مكرم رجائي", "كيرلس شفيق سامي", "ماثيو حسني", "مارتن مراد", "مارك رفعت", "متأوس القس اسحق", "مينا جوزيف", "مينا عوض", "نادر نائل", "يوسف اسعد", "يوسف بيتر ماهر", "يوسف نسيم", "كيفين مينا", "يوسف بيشوى", "توماس ثروت", "شنودة اسحق", "كيرلس سمير", "كيفين شنودة", "اليكسندروس", "كيرلس نبيل", "رافائيل", "كيفين ايمن", "بيتر رومانى", "توماس رامى", "يوسف بيتر", "صموئيل", "ديفيد ريمون", "ديفيد ماجد", "امير عطيى", "كرستيانو وائل", "كاراس ابراهيم", "يوسف اشرف", "فيلوباتير سامى", "ابانوب جرجس", "ايلي باسم", "كيرلس جوزيف", "امير هاني", "كاراس ميلاد", "جوناثان عوني", "دانيال كمال", "مايكل هاني", "ارساني بولس", "مايكل ملاك", "جورج رامي", "ماثيو اشرف", "مارك مينا", "كيرلس وليم", "باتريك ريمون", "ارميا عاطف", "كيرلس هاني", "بيتر جورج", "مارتينو وائل", "ماير مسامح", "مارك مسامح", "جاك اميل", "اندرو مدحت", "وديع ايهاب", "بولا ميلاد", "توماس عطا", "فليمون عماد", "ابانوب مينا", "توماس وائل", "مينا سامي", "سمعان عيسي", "بولا هاني", null, null, null, null, null, null, null, null, null, null, null, null, null];

const DEFAULT_SETTINGS = {
  conferenceTitle: "مؤتمر إعدادي بنين 2026",
  defaultInitialPrice: 100,
  pointsPerStep: 10,
  pricePerStep: 10,
  adminPin: "2026",
  categories: [
    {key:"memo", label:"الحفظ", sign:1},
    {key:"games", label:"الألعاب", sign:1},
    {key:"attendance", label:"الحضور", sign:1},
    {key:"extra", label:"أنشطة إضافية", sign:1},
    {key:"penalty", label:"خصم / جزاء", sign:-1},
  ]
};

let STATE = {
  players: null,
  teams: null,
  settings: null,
  prevRanks: {},
  adminUnlocked: false,
  myTeams: [], // [{teamId, editCode}]
};

let SELECTED_IDS = [];   // for team builder
let EDITING_TEAM_ID = null;
let SCORING_DIRTY = {};  // playerId -> patched category obj (unsaved)
let ADMIN_TAB = "players";

/* ============================================================
   STORAGE HELPERS
============================================================ */
async function storeGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    if(!r) return null;
    return JSON.parse(r.value);
  }catch(e){ return null; }
}
async function storeSet(key, value, shared){
  try{
    const r = await window.storage.set(key, JSON.stringify(value), shared);
    return !!r;
  }catch(e){ return false; }
}

function toast(msg, type){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity=0; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}
function genEditCode(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

/* ============================================================
   INITIAL LOAD / SEED
============================================================ */
async function loadAll(){
  let players = await storeGet('ffl_players', true);
  let settings = await storeGet('ffl_settings', true);
  let teams = await storeGet('ffl_teams', true);
  let prevRanks = await storeGet('ffl_prevranks', true);

  if(!settings){
    settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    await storeSet('ffl_settings', settings, true);
  } else {
    // backfill any missing fields from defaults (future-proofing)
    settings = Object.assign({}, DEFAULT_SETTINGS, settings);
    if(!settings.categories || !settings.categories.length) settings.categories = DEFAULT_SETTINGS.categories;
  }

  if(!players){
    players = SEED_NAMES.map((name, i)=>{
      const catPoints = {};
      settings.categories.forEach(c=>catPoints[c.key]=0);
      return {
        id: i+1,
        name: name,
        photo: "",
        initialPrice: settings.defaultInitialPrice,
        catPoints: catPoints,
        status: name ? "ready" : "empty",
        notes: ""
      };
    });
    await storeSet('ffl_players', players, true);
  } else {
    // ensure every category key exists on every player (future categories added later)
    let changed = false;
    players.forEach(p=>{
      if(!p.catPoints) p.catPoints = {};
      settings.categories.forEach(c=>{
        if(!(c.key in p.catPoints)){ p.catPoints[c.key]=0; changed=true; }
      });
    });
  }

  if(!teams) teams = [];
  if(!prevRanks) prevRanks = {};

  STATE.players = players;
  STATE.settings = settings;
  STATE.teams = teams;
  STATE.prevRanks = prevRanks;

  STATE.adminUnlocked = !!(await storeGet('ffl_admin_unlocked', false));
  STATE.myTeams = (await storeGet('ffl_my_teams', false)) || [];
}

/* ============================================================
   COMPUTED HELPERS
============================================================ */
function totalPoints(p){
  let t = 0;
  STATE.settings.categories.forEach(c=>{
    const v = Number(p.catPoints[c.key]||0);
    t += v * (c.sign||1);
  });
  return t;
}
function currentPrice(p){
  const pts = totalPoints(p);
  const step = Math.floor(pts / STATE.settings.pointsPerStep) * STATE.settings.pricePerStep;
  return Number(p.initialPrice||0) + step;
}
function namedPlayers(){ return STATE.players.filter(p=>p.name); }
function playerById(id){ return STATE.players.find(p=>p.id===id); }

function rankedPlayers(){
  return namedPlayers().slice().sort((a,b)=>totalPoints(b)-totalPoints(a));
}
function teamPoints(team){
  return team.playerIds.reduce((s,id)=>{
    const p = playerById(id);
    return s + (p ? totalPoints(p) : 0);
  },0);
}
function teamPrice(team){
  return team.playerIds.reduce((s,id)=>{
    const p = playerById(id);
    return s + (p ? currentPrice(p) : 0);
  },0);
}
function rankedTeams(){
  return STATE.teams.slice().sort((a,b)=>teamPoints(b)-teamPoints(a));
}
function initials(name){
  if(!name) return "?";
  return name.trim().charAt(0);
}
function avatarColor(seed){
  const colors = ["#4C8DE0,#2c5ea8","#E9BE4D,#a9781f","#33C481,#1f7d54","#c46bd8,#7a3a90","#EF5A5A,#a83636","#6bd8c4,#2f8f80"];
  let h=0; for(let i=0;i<(seed||"x").length;i++) h = (h + seed.charCodeAt(i))%colors.length;
  return colors[h];
}
function avatarHtml(p, size){
  const grad = avatarColor(p.name||String(p.id));
  const style = `background:linear-gradient(145deg,${grad.split(',')[0]},${grad.split(',')[1]});`+(size?`width:${size}px;height:${size}px;`:"");
  if(p.photo){
    return `<div class="avatar" style="${style}"><img src="${escAttr(p.photo)}" onerror="this.parentElement.innerHTML='${initials(p.name)}'"></div>`;
  }
  return `<div class="avatar" style="${style}">${initials(p.name)}</div>`;
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }

/* ============================================================
   ROUTER
============================================================ */
function currentRoute(){
  const h = location.hash.replace('#/','') || 'dashboard';
  return h.split('?')[0];
}
window.addEventListener('hashchange', render);

function setActiveNav(){
  const r = currentRoute();
  document.querySelectorAll('#nav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.r === r);
  });
}

async function render(){
  setActiveNav();
  const app = document.getElementById('app');
  const route = currentRoute();
  if(route === 'dashboard') app.innerHTML = viewDashboard();
  else if(route === 'players') app.innerHTML = viewPlayers();
  else if(route === 'team') app.innerHTML = viewTeam();
  else if(route === 'leaderboard') app.innerHTML = viewLeaderboard();
  else if(route === 'scoring') app.innerHTML = viewScoring();
  else if(route === 'admin') app.innerHTML = viewAdmin();
  else app.innerHTML = viewDashboard();
  window.scrollTo(0,0);
  afterRender(route);
}

function toggleSelect(id){
  const idx = SELECTED_IDS.indexOf(id);
  if(idx>-1){ SELECTED_IDS.splice(idx,1); }
  else {
    if(SELECTED_IDS.length>=5){ toast('لا يمكن اختيار أكثر من ٥ لاعبين','err'); return; }
    SELECTED_IDS.push(id);

  renderTeamBuilderGrid();
}
function updateSelSummary(){

  if(!box) return;
  const names = SELECTED_IDS.map(id=>playerById(id)?.name).filter(Boolean);
  const pts = SELECTED_IDS.reduce((s,id)=>s+totalPoints(playerById(id)),0);
  const price = SELECTED_IDS.reduce((s,id)=>s+currentPrice(playerById(id)),0);
  box.innerHTML = `<b>${SELECTED_IDS.length}/5</b> محدَّدين ${names.length?'— '+names.join('، '):''}
    <br>إجمالي النقاط: <b style="color:var(--gold-2)">${pts}</b> · إجمالي السعر: <b>${price}</b>`;
}
async function saveTeam(existingId){
  const ownerName = document.getElementById('ownerName').value.trim();
  const teamName = document.getElementById('teamName').value.trim();
  if(!ownerName){ toast('من فضلك اكتب اسمك','err'); return; }
  if(!teamName){ toast('من فضلك اكتب اسم الفريق','err'); return; }
  if(SELECTED_IDS.length !== 5){ toast('يجب اختيار ٥ لاعبين بالضبط','err'); return; }
  const uniqueCheck = new Set(SELECTED_IDS);
  if(uniqueCheck.size !== 5){ toast('لا يمكن تكرار اللاعب في الفريق','err'); return; }

  if(existingId){
    const t = STATE.teams.find(x=>x.id===existingId);
    t.ownerName = ownerName; t.teamName = teamName; t.playerIds = SELECTED_IDS.slice();
    const ok = await storeSet('ffl_teams', STATE.teams, true);
    if(ok) toast('تم حفظ التعديلات بنجاح','ok'); else toast('حدث خطأ أثناء الحفظ','err');
  } else {
    const newTeam = { id: uid('tm'), ownerName, teamName, playerIds: SELECTED_IDS.slice(), editCode: genEditCode(), notes:"", createdAt: Date.now() };
    STATE.teams.push(newTeam);
    const ok = await storeSet('ffl_teams', STATE.teams, true);
    if(ok){
      STATE.myTeams.push({teamId:newTeam.id, editCode:newTeam.editCode});
      await storeSet('ffl_my_teams', STATE.myTeams, false);
      EDITING_TEAM_ID = newTeam.id;
      document.getElementById('teamTabBody').innerHTML = `
        <div class="card" style="max-width:480px;text-align:center">
          <div style="font-size:34px">🎉</div>
          <h3 style="margin:8px 0 4px">تم إنشاء فريقك بنجاح!</h3>
          <p style="color:var(--ink-dim);font-size:13.5px">احتفظ برقم الفريق ورمز التعديل — ستحتاجهما لتعديل فريقك لاحقًا.</p>
          <div class="field" style="text-align:right"><label>رقم الفريق</label><input type="text" readonly value="${newTeam.id}" onclick="this.select()"></div>
          <div class="field" style="text-align:right"><label>رمز التعديل</label><input type="text" readonly value="${newTeam.editCode}" onclick="this.select()"></div>
          <a href="#/leaderboard" class="btn btn-gold btn-block">🏆 اذهب إلى لوحة الترتيب</a>
        </div>`;
      toast('تم إنشاء الفريق بنجاح','ok');
    } else toast('حدث خطأ أثناء الحفظ، حاول مرة أخرى','err');
  }
}
async function deleteTeam(id){
  if(!confirm('هل تريد حذف هذا الفريق نهائيًا؟')) return;
  STATE.teams = STATE.teams.filter(t=>t.id!==id);
  const ok = await storeSet('ffl_teams', STATE.teams, true);
  if(ok){ toast('تم حذف الفريق','ok'); EDITING_TEAM_ID=null; SELECTED_IDS=[]; render(); }
  else toast('تعذّر الحذف','err');
}

        const rank=i+1;
        const prevRank = STATE.prevRanks['t_'+t.id];

        if(prevRank!=null){
          if(prevRank>rank) chg = `<span class="chg-up">▲ ${prevRank-rank}</span>`;
          else if(prevRank<rank) chg = `<span class="chg-down">▼ ${rank-prevRank}</span>`;
          else chg = `<span class="chg-same">–</span>`;
        }
        return `<tr>
          <td><span class="rank-badge ${rank<=3?'rank-'+rank:''}">${rank}</span></td>
          <td style="font-weight:800">${esc(t.teamName)}</td>
          <td style="color:var(--ink-dim)">${esc(t.ownerName)}</td>

          <td style="font-weight:800;color:var(--gold-2)">${teamPoints(t)}</td>
          <td>${teamPrice(t)}</td>
          <td>${chg}</td>
        </tr>`;
      }).join("")}
      </tbody></table></div>
    </div>`;
    const newRanks = {};
    teams.forEach((t,i)=>newRanks['t_'+t.id]=i+1);
    STATE.prevRanks = Object.assign({}, STATE.prevRanks, newRanks);
    storeSet('ffl_prevranks', STATE.prevRanks, true);
  } else {
    const players = rankedPlayers();
    if(!players.length){ body.innerHTML = `<div class="card empty-state"><div class="big">⭐</div>لا يوجد لاعبون مسجلون بعد</div>`; return; }

          <td><span class="rank-badge ${rank<=3?'rank-'+rank:''}">${rank}</span></td>

          <td>${currentPrice(p)}</td>
        </tr>`;
      }).join("")}
    </tbody></table></div></div>`;
  }
}

  const tbody = document.getElementById('scoreBody');
  if(!tbody) return;
  const q = (document.getElementById('scoreSearch')?.value||"").trim();
  let list = namedPlayers();
  if(q) list = list.filter(p=>p.name.includes(q));
  const cats = STATE.settings.categories;
  tbody.innerHTML = list.map(p=>{
    const patch = SCORING_DIRTY[p.id] || {};
    return `<tr>
      <td>${p.id}</td>
      <td style="font-weight:700;white-space:nowrap">${esc(p.name)}</td>
      ${cats.map(c=>{
        const val = (c.key in patch) ? patch[c.key] : (p.catPoints[c.key]||0);
        return `<td><input type="number" style="width:70px" value="${val}" oninput="markDirty(${p.id},'${c.key}',this.value)"></td>`;
      }).join("")}
      <td style="font-weight:800;color:var(--gold-2)">${liveTotalForRow(p)}</td>
      <td>${liveTotalForRow(p, true)}</td>
    </tr>`;
  }).join("");
}
function liveTotalForRow(p, wantPrice){
  const patch = SCORING_DIRTY[p.id] || {};
  const merged = Object.assign({}, p.catPoints, patch);
  let t=0; STATE.settings.categories.forEach(c=>{ t += Number(merged[c.key]||0)*(c.sign||1); });
  if(!wantPrice) return t;
  const step = Math.floor(t/STATE.settings.pointsPerStep)*STATE.settings.pricePerStep;
  return Number(p.initialPrice||0)+step;
}
function markDirty(id, key, val){
  if(!SCORING_DIRTY[id]) SCORING_DIRTY[id]={};
  SCORING_DIRTY[id][key] = val;
  // live update totals for that row without full re-render
  renderScoringTable();
  const search = document.getElementById('scoreSearch');
  if(search) search.focus();
}
async function saveScoring(){
  const ids = Object.keys(SCORING_DIRTY);
  if(!ids.length){ toast('لا توجد تغييرات لحفظها','err'); return; }
  ids.forEach(idStr=>{
    const id = Number(idStr);
    const p = playerById(id);
    if(!p) return;
    Object.keys(SCORING_DIRTY[id]).forEach(key=>{
      p.catPoints[key] = Number(SCORING_DIRTY[id][key])||0;
    });
  });
  const ok = await storeSet('ffl_players', STATE.players, true);
  if(ok){ SCORING_DIRTY={}; toast('تم حفظ النقاط وتحديث كل الأسعار والترتيب','ok'); renderScoringTable(); }
  else toast('حدث خطأ أثناء الحفظ','err');
}

async function addPlayerToSlot(){
  const id = Number(document.getElementById('emptySlotSelect').value);
  const name = document.getElementById('newPlayerName').value.trim();
  if(!name){ toast('اكتب اسم اللاعب','err'); return; }
  const p = playerById(id);
  p.name = name; p.status='ready';
  const ok = await storeSet('ffl_players', STATE.players, true);
  if(ok){ toast('تمت إضافة اللاعب','ok'); render(); } else toast('خطأ في الحفظ','err');
}
function editPlayerField(id, field, val){
  const p = playerById(id);
  if(field==='name'){ p.name = val || null; p.status = val?'ready':'empty'; }
  else p[field] = val;
  ADMIN_PLAYER_DIRTY = true;
}
let ADMIN_PLAYER_DIRTY = false;
async function persistPlayerEdits(){
  const ok = await storeSet('ffl_players', STATE.players, true);
  if(ok){ toast('تم الحفظ','ok'); ADMIN_PLAYER_DIRTY=false; render(); } else toast('خطأ في الحفظ','err');
}
async function clearPlayerSlot(id){
  if(!confirm('إخلاء هذا اللاعب وتحويله لخانة فارغة؟ سيتم حذف نقاطه.')) return;
  const p = playerById(id);
  p.name=null; p.photo=""; p.status='empty';
  STATE.settings.categories.forEach(c=>p.catPoints[c.key]=0);
  const ok = await storeSet('ffl_players', STATE.players, true);
  if(ok){ toast('تم إخلاء الخانة','ok'); render(); }
}

        </select></td>

      </tr>`).join("")}

      <div class="sticky-bar"><button class="btn btn-gold" onclick="persistCategories()">💾 حفظ تعديلات الفئات</button></div>
    </div>
    <div class="card">
      <div class="section-title"><h2 style="font-size:14.5px">➕ إضافة فئة جديدة</h2></div>
      <div class="two-col">
        <div class="field"><label>اسم الفئة (بالعربي)</label><input type="text" id="newCatLabel" placeholder="مثال: التميّز الروحي"></div>
        <div class="field"><label>النوع</label><select id="newCatSign"><option value="1">إضافة (+)</option><option value="-1">خصم (-)</option></select></div>

      <button class="btn btn-gold" onclick="addCategory()">إضافة الفئة</button>
      <div class="notice" style="margin-top:12px">إضافة فئة جديدة لن تؤثر على النقاط الحالية. حذف فئة سيحذف نقاطها من جميع اللاعبين نهائيًا.</div>
    </div>
  `;
}
function editCategory(i, field, val){ STATE.settings.categories[i][field]=val; ADMIN_SETTINGS_DIRTY=true; }
let ADMIN_SETTINGS_DIRTY=false;
async function persistCategories(){
  const ok = await storeSet('ffl_settings', STATE.settings, true);
  if(ok){ ADMIN_SETTINGS_DIRTY=false; toast('تم الحفظ','ok'); render(); } else toast('خطأ في الحفظ','err');
}
async function addCategory(){
  const label = document.getElementById('newCatLabel').value.trim();
  const sign = Number(document.getElementById('newCatSign').value);
  if(!label){ toast('اكتب اسم الفئة','err'); return; }
  const key = 'cat_' + Math.random().toString(36).slice(2,7);
  STATE.settings.categories.push({key,label,sign});
  STATE.players.forEach(p=>{ if(!p.catPoints) p.catPoints={}; p.catPoints[key]=0; });
  const ok1 = await storeSet('ffl_settings', STATE.settings, true);
  const ok2 = await storeSet('ffl_players', STATE.players, true);
  if(ok1&&ok2){ toast('تمت إضافة الفئة','ok'); render(); } else toast('خطأ في الحفظ','err');
}
async function removeCategory(i){
  const cat = STATE.settings.categories[i];
  if(!confirm(`حذف فئة "${cat.label}"؟ سيؤثر هذا على نقاط جميع اللاعبين.`)) return;
  STATE.settings.categories.splice(i,1);
  STATE.players.forEach(p=>{ if(p.catPoints) delete p.catPoints[cat.key]; });
  const ok1 = await storeSet('ffl_settings', STATE.settings, true);
  const ok2 = await storeSet('ffl_players', STATE.players, true);
  if(ok1&&ok2){ toast('تم حذف الفئة','ok'); render(); } else toast('خطأ في الحفظ','err');
}

function adminSettingsHtml(){
  const s = STATE.settings;
  return `

async function saveGeneral(){
  STATE.settings.conferenceTitle = document.getElementById('gConfTitle').value.trim() || STATE.settings.conferenceTitle;
  const ok = await storeSet('ffl_settings', STATE.settings, true);
  if(ok) toast('تم الحفظ','ok'); else toast('خطأ','err');
}
async function saveNewPin(){
  const pin = document.getElementById('gNewPin').value.trim();
  if(!pin){ toast('اكتب رمزًا جديدًا','err'); return; }
  STATE.settings.adminPin = pin;
  const ok = await storeSet('ffl_settings', STATE.settings, true);
  if(ok) toast('تم تحديث رمز الإدارة','ok'); else toast('خطأ','err');
}
async function resetAllData(){
  if(!confirm('هل أنت متأكد؟ سيتم حذف جميع اللاعبين والفرق والنقاط نهائيًا.')) return;
  if(!confirm('تأكيد أخير: هذا الإجراء لا يمكن التراجع عنه. استمرار؟')) return;
  const settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  const players = SEED_NAMES.map((name,i)=>{
    const catPoints={}; settings.categories.forEach(c=>catPoints[c.key]=0);
    return {id:i+1,name,photo:"",initialPrice:settings.defaultInitialPrice,catPoints,status:name?"ready":"empty",notes:""};
  });
  await storeSet('ffl_settings', settings, true);
  await storeSet('ffl_players', players, true);
  await storeSet('ffl_teams', [], true);
  await storeSet('ffl_prevranks', {}, true);
  toast('تمت إعادة ضبط جميع البيانات','ok');
  await loadAll();
  render();
}

/* ============================================================
   AFTER-RENDER HOOKS (per-route JS init)
============================================================ */
function afterRender(route){
  if(route==='players') renderPlayerGrid();
  if(route==='team') switchTeamTab(EDITING_TEAM_ID?'edit':'new');
  if(route==='leaderboard') afterRenderLeaderboard();
  if(route==='scoring' && STATE.adminUnlocked) renderScoringTable();
  if(route==='admin' && STATE.adminUnlocked) afterRenderAdmin();
}

/* ============================================================
   BOOT
============================================================ */
async function boot(){
  await loadAll();
  render();
}
boot();
